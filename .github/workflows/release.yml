name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and reminder logic
        run: |
          npm run typecheck
          npm run test:reminder
          npm run test:social
      - name: Build installer and portable executable
        run: npm run dist -- --publish never
      - name: Check packaged window integration
        run: node scripts/check-resizing.cjs
      - name: Publish latest GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and package version do not match." }
          $installer = Get-Item -LiteralPath "release/Shinchan-Pet-$version-Setup.exe"
          $portable = Get-Item -LiteralPath "release/Shinchan-Pet-$version-Portable.exe"
          gh release create $env:GITHUB_REF_NAME `
            $installer.FullName $portable.FullName `
            --target $env:GITHUB_SHA `
            --latest `
            --title "蜡笔小新桌宠 $env:GITHUB_REF_NAME" `
            --notes-file "docs/releases/$env:GITHUB_REF_NAME.md"
