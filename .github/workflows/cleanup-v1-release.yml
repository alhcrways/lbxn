name: Remove legacy checksum asset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-v1-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the portable executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset v1.0.0 Shinchan-Pet-1.0.0-Portable.exe.sha256 --yes --repo "$GITHUB_REPOSITORY"
